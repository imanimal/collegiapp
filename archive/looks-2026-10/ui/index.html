<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Collegiapp</title>
  <meta name="description" content="Collegiapp: one do-first list for UCSB classes, Canvas work, events and focus, with retro-modern and classic CRT looks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@500;800&family=Press+Start+2P&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=VT323&display=swap">
  <link rel="stylesheet" href="css/core.css">
  <link rel="stylesheet" href="css/crt.css">
  <link rel="stylesheet" href="css/renditions.css">
  <link rel="stylesheet" href="css/modern.css">
  <link rel="stylesheet" href="css/lab.css">
</head>
<body>
  <div class="desk" id="desk">
    <div class="shellbar" id="shellbar" hidden></div>
    <div class="island" id="island" hidden></div>

    <div class="monitor" id="monitor">
      <div class="bezel">
        <div class="screen" id="screen" data-r="signal">
          <div class="content" id="content">
            <header class="region top" id="top"></header>
            <nav class="region nav" id="nav" aria-label="Views"></nav>
            <section class="region now" id="now" aria-label="Do first"></section>
            <section class="region sched" id="sched" aria-label="Schedule"></section>
            <section class="region list" id="list" aria-label="Items"></section>
            <aside class="region insp" id="insp" aria-label="Inspector"></aside>
            <div class="region ticker" id="ticker" aria-hidden="true"></div>
            <footer class="region bottom" id="bottom"></footer>
          </div>
          <div class="layer" id="layer">
            <div class="ov" id="ov" hidden></div>
            <div class="radial" id="radial" hidden></div>
            <div class="tips" id="tips" hidden></div>
            <div id="menuHost" hidden></div>
            <div class="toasts" id="toasts" aria-live="polite"></div>
          </div>
          <div class="fx" aria-hidden="true">
            <div class="fx-scan"></div><div class="fx-mask"></div><div class="fx-noise"></div><div class="fx-roll"></div>
            <div class="fx-flick"></div><div class="fx-vignette"></div><div class="fx-glass"></div><div class="fx-flash"></div>
          </div>
        </div>
        <div class="bezel-bar">
          <span class="brand">COLLEGIAPP <b>CRT-26</b></span>
          <button class="hw" data-hw="prev" title="Previous rendition ( [ )" aria-label="Previous rendition">◄</button>
          <button class="hw" data-hw="next" title="Next rendition ( ] )" aria-label="Next rendition">►</button>
          <button class="hw" data-hw="menu" title="Design Lab (Ctrl+. or F9)">MENU</button>
          <button class="hw" data-hw="degauss" title="Degauss">DEG</button>
          <span class="model" id="bzModel"></span>
          <button class="hw" data-hw="power" title="Power" aria-label="Power">⏻</button>
          <span class="led" id="led"></span>
        </div>
      </div>
    </div>

    <div class="taskbar" id="taskbar" hidden></div>
  </div>

  <aside class="lab" id="lab" hidden aria-label="Design Lab"></aside>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="crtWarp" filterUnits="objectBoundingBox" primitiveUnits="objectBoundingBox" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feImage id="warpMap" result="map" preserveAspectRatio="none" x="0" y="0" width="1" height="1"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="0.035" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lab.js"></script>
</body>
</html>
