<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collegiapp Island</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
  <style>
    /* Collegiapp — the always-on-top "live activity" window (380×64, transparent, no frame).
       Tokens come from the main window's theme via localStorage "capp.tokens". */
    :root { --fg: #41ff7a; --hi: #c8ffd8; --warn: #e3ff6b; --glow-rgb: 65, 255, 122; --font-body: "VT323", Consolas, monospace; --font-scale: 1.3; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .pill {
      position: absolute; inset: 6px; border-radius: 999px; background: #040404; color: var(--fg);
      display: flex; align-items: center; gap: 10px; padding: 0 16px 0 10px; cursor: default;
      font: calc(15px * var(--font-scale)) / 1 var(--font-body);
      text-shadow: 0 0 3px rgba(var(--glow-rgb), .6);
      box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 14px rgba(var(--glow-rgb), .18);
    }
    .pill::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); }
    svg { width: 30px; height: 30px; flex: none; }
    circle { fill: none; stroke-width: 3; }
    .tr { stroke: rgba(var(--glow-rgb), .2); }
    .pr { stroke: var(--fg); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 1s linear; }
    .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .lbl, .det { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .det { font-size: .72em; opacity: .7; }
    .cd { color: var(--hi); font-variant-numeric: tabular-nums; }
    .soon .cd { color: var(--warn); animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .soon .cd { animation: none; } }
  </style>
</head>
<body>
  <div class="pill" id="pill" data-tauri-drag-region title="Drag to move · double-click opens Collegiapp">
    <svg viewBox="0 0 30 30" aria-hidden="true"><circle class="tr" cx="15" cy="15" r="12"/><circle class="pr" id="ring" cx="15" cy="15" r="12" stroke-dasharray="75.4" stroke-dashoffset="75.4"/></svg>
    <div class="txt" data-tauri-drag-region><span class="lbl" id="lbl" data-tauri-drag-region>COLLEGIAPP</span><span class="det" id="det" data-tauri-drag-region>nothing scheduled in the next 12h</span></div>
    <span class="cd" id="cd" data-tauri-drag-region></span>
  </div>
  <script>
    (function () {
      const T = window.__TAURI__, $ = (id) => document.getElementById(id);
      let p = null;
      try { const t = JSON.parse(localStorage.getItem("capp.tokens") || "null"); if (t) for (const k in t) document.documentElement.style.setProperty("--" + k, t[k]); } catch (e) {}
      const two = (n) => String(n).padStart(2, "0");
      function clock(ms) {
        if (ms <= 0) return "NOW";
        const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        return h >= 24 ? Math.floor(h / 24) + "D " + (h % 24) + "H" : (h ? h + ":" + two(m) : m) + ":" + two(s % 60);
      }
      function draw() {
        const now = Date.now();
        if (!p) { $("lbl").textContent = "COLLEGIAPP"; $("det").textContent = "nothing scheduled in the next 12h"; $("cd").textContent = ""; $("ring").setAttribute("stroke-dashoffset", "75.4"); return; }
        const start = Date.parse(p.starts_at), end = p.ends_at ? Date.parse(p.ends_at) : null, live = now >= start && end && now < end;
        $("lbl").textContent = (live ? "IN CLASS · " : "") + p.label;
        $("det").textContent = p.detail || p.location || "";
        $("cd").textContent = clock((live ? end : start) - now);
        const frac = live ? (now - start) / (end - start) : Math.max(0, 1 - (start - now) / 3600000);
        $("ring").setAttribute("stroke-dashoffset", (75.4 * (1 - Math.max(0, Math.min(1, frac)))).toFixed(1));
        $("pill").classList.toggle("soon", !live && start - now < 10 * 60000);
      }
      if (T) {
        T.event.listen("presence", (e) => { p = e.payload; draw(); });
        T.core.invoke("get_presence").then((v) => { p = v; draw(); }, () => {});
        $("pill").addEventListener("dblclick", async () => {
          try { const main = await T.webviewWindow.WebviewWindow.getByLabel("main"); if (main) { await main.show(); await main.unminimize(); await main.setFocus(); } } catch (e) {}
        });
      }
      draw(); setInterval(draw, 1000);
    })();
  </script>
</body>
</html>
