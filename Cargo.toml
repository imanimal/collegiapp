[workspace]
resolver = "2"
members = ["crates/collegiapp-core", "src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/imanimal/collegiapp"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
