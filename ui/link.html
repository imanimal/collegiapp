<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- "origin": the post to the app (http://127.0.0.1) carries this site's origin; the stricter policies send "null" -->
<meta name="referrer" content="origin">
<title>Sign in Collegiapp</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* the desktop app's sign-in page (js/link.js), on the Pocket palette: P9 Cream, P11-like at night */
  :root { --bg: #e6e2d8; --surface: #f6f3ec; --line: #d3ccbd; --text: #1b1915; --text-2: #4a453c; --accent: #ff5b1f; --on-accent: #1b1915; --bad: #b3361d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141310; --surface: #1f1d19; --line: #3a362f; --text: #efe9dc; --text-2: #b9b2a4; --bad: #f08a6c; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(100%, 440px); background: var(--surface); border-radius: 14px; padding: 24px; box-shadow: 0 0 0 1px var(--line), 0 2px 0 var(--line); }
  h1 { font-size: 1.25em; margin: 0 0 .4em; }
  p { margin: 0 0 1em; color: var(--text-2); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: .6em 1.1em; cursor: pointer; background: transparent; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  button.primary { background: var(--accent); color: var(--on-accent); box-shadow: none; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  #msg { margin: 1em 0 0; min-height: 1.5em; }
  #msg.bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Sign in the Collegiapp app</h1>
  <p>Collegiapp on this computer asked to sign in. Choose your Google account, and the app syncs your list and notes through this project.</p>
  <div class="row"><button id="go" class="primary" disabled>Sign in with Google</button><button id="no">Cancel</button></div>
  <p id="msg" role="status" aria-live="polite"></p>
</main>
<script src="js/cloud-config.js"></script>
<script src="js/link.js"></script>
</body>
</html>
