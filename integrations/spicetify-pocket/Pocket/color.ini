; Pocket for Spotify: the two Pocket palettes from docs/UIKit/README.md section 2.
; [night] is P11 (default, first section). [cream] is P9.
; Standard Spicetify keys map onto Pocket's surfaces; the extra keys (bg, line, chrome-*, disp-* ...) are exposed
; as --spice-<key> too, and user.css reads them as --pk-*. Change a value here first, then the UI kit tables.

