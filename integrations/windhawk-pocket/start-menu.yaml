# Pocket for Windows: Start menu. Settings for the Windhawk mod "Windows 11 Start Menu Styler"
# (windows-11-start-menu-styler): run apply.ps1, or Settings tab › Textual mode › paste › Save settings (then set
# Assets below to your copy of the assets folder). Night (P11).
# The Start board from the design canvas: Collegiapp's quick-add field ringed in orange with a › prompt and an Esc
# chip; Pinned, Do first (Windows' Recommended) and All apps as modules under printed label bands with pixel icons;
# apps as raised keys with their icon in a well; and a footer deck with a dark Power key. Every stock section stays.
# Pieces Windhawk can't draw (band icons, the Power icon) are images from build_assets.py.
styleConstants:
  - Bg=#1A1917
  - Bg2=#2A2926
  - Surface=#262522
  - Surface2=#302E2A
  - Line=#3F3C36
  - Chrome=#0F0E0D
  - ChromeFg=#ECE6DA
  - Accent=#FF6A2B
  - OnAccent=#1B1915
  - Text=#F4EFE5
  - Text2=#D0C9BA
  - Text3=#A39C8D
  - WellDeck=#252421
  - Well=#393732
  - WellRing=#52A39C8D
  - KeyEdge=#2A2824
  - KeyBrush=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#4D4B48" Offset="0"/><GradientStop Color="#302E2A" Offset="1"/></LinearGradientBrush>
  - KeyBrushHover=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#666461" Offset="0"/><GradientStop Color="#302E2A" Offset="1"/></LinearGradientBrush>
  - ChromeBrush=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#2C2B2A" Offset="0"/><GradientStop Color="#0F0E0D" Offset="1"/></LinearGradientBrush>
  - ChromeBrushHover=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#3A3937" Offset="0"/><GradientStop Color="#1A1918" Offset="1"/></LinearGradientBrush>
  # The folder holding build_assets.py's images. apply.ps1 fills in the real path.
  - Assets=file:///C:/collegiapp/integrations/windhawk-pocket/assets
controlStyles:
  # The board.
  - target: Border#AcrylicBorder
    styles:
      - Background=$Bg
      - BorderBrush=$Line
      - BorderThickness=1
      - CornerRadius=18
  - target: Border#AcrylicOverlay
    styles:
      - Opacity=0
  - target: Border#AppBorder, Border#AccentAppBorder
    styles:
      - Background=$Bg
      - BorderBrush=$Line
      - BorderThickness=1
      - CornerRadius=18
  - target: Border#LayerBorder, Border#AccentLayerBorder
    styles:
      - Opacity=0
  - target: Border#dropshadow
    styles:
      - CornerRadius=19
  - target: Border#StartDropShadow
    styles:
      - CornerRadius=18
  # Search: Collegiapp's quick-add field. Orange ring, an orange › prompt where the magnifier was, an Esc chip.
  - target: StartMenu.SearchBoxToggleButton > Grid > Border#BorderElement, StartDocked.SearchBoxToggleButton > Grid > Border#BorderElement
    styles:
      - Background=$Bg2
      - BorderBrush=$Accent
      - BorderThickness=2
      - CornerRadius=10
      - Child:=<Grid><TextBlock Text="›" FontFamily="Space Mono" FontWeight="Bold" FontSize="22" Foreground="$Accent" Margin="14,0,0,3" VerticalAlignment="Center" HorizontalAlignment="Left"/><Border HorizontalAlignment="Right" VerticalAlignment="Center" Margin="0,0,8,0" Padding="6,3,6,3" CornerRadius="4" Background="$Surface" BorderBrush="$Line" BorderThickness="1,1,1,2"><TextBlock Text="Esc" FontFamily="Space Mono" FontSize="11" Foreground="$Text3"/></Border></Grid>
  - target: StartMenu.SearchBoxToggleButton > Grid > FontIcon#SearchGlyph, StartMenu.SearchBoxToggleButton > Grid > Image#SearchIconOff, StartMenu.SearchBoxToggleButton > Grid > Image#SearchIconOn, StartMenu.SearchBoxToggleButton > Grid > FontIcon
    styles:
      - Opacity=0
  - target: StartMenu.SearchBoxToggleButton > Grid > ContentPresenter > TextBlock#PlaceholderText, StartMenu.SearchBoxToggleButton > Grid > ContentPresenter#ContentPresenter > TextBlock#PlaceholderText
    styles:
      - Text=Open an app, a file or a setting
      - FontSize=16
      - Foreground=$Text3
  - target: StartMenu.SearchBoxToggleButton > Grid > Rectangle#TextCaret
    styles:
      - Fill=$Accent
  - target: Border#TaskbarSearchBackground
    styles:
      - Background=$Bg
      - BorderBrush=$Line
      - BorderThickness=1
      - CornerRadius=18
  # Label bands (F3): a printed graphite strip with a pixel icon and a spaced capital label; Do first is orange.
  # The band images are exactly 38.4 px tall so they draw 1:1.
  - target: Grid#TopLevelHeader > Grid#PinnedListHeaderGrid, Grid#TopLevelHeader > Grid#AllListHeading, Grid#TopLevelSuggestionsListHeader
    styles:
      - CornerRadius=14,14,0,0
      - Margin=22,0,22,0
      - Padding=38,0,8,0
      - Height=38.4
      - BorderBrush=#40000000
      - BorderThickness=0,0,0,1
  - target: Grid#TopLevelHeader > Grid#PinnedListHeaderGrid
    styles:
      - Background:=<ImageBrush Stretch="UniformToFill" AlignmentX="Left" ImageSource="$Assets/band-pinned.png"/>
  - target: Grid#TopLevelHeader > Grid#AllListHeading
    styles:
      - Margin=22,14,22,0
      - CornerRadius=14
      - Background:=<ImageBrush Stretch="UniformToFill" AlignmentX="Left" ImageSource="$Assets/band-all.png"/>
  - target: Grid#TopLevelSuggestionsListHeader
    styles:
      - Background:=<ImageBrush Stretch="UniformToFill" AlignmentX="Left" ImageSource="$Assets/band-dofirst.png"/>
  - target: Grid#PinnedListHeaderGrid > TextBlock, TextBlock#PinnedListHeaderText, TextBlock#AllListHeadingText, TextBlock#TopLevelSuggestionsListHeaderText
    styles:
      - Margin=0
      - VerticalAlignment=Center
      - FontFamily=Space Grotesk
      - FontWeight=Bold
      - FontSize=11.5
      - CharacterSpacing=110
      - Foreground=$ChromeFg
  - target: Grid#PinnedListHeaderGrid > TextBlock, TextBlock#PinnedListHeaderText
    styles:
      - Text=PINNED
  - target: TextBlock#AllListHeadingText
    styles:
      - Text=ALL APPS
  - target: TextBlock#TopLevelSuggestionsListHeaderText
    styles:
      - Text=DO FIRST
      - Foreground=$OnAccent
  - target: Grid#TopLevelSuggestionsListHeader > * > TextBlock, Grid#TopLevelSuggestionsListHeader > * > FontIcon
    styles:
      - Foreground=$OnAccent
  # Module bodies: surface cards under their bands.
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root, Grid#TopLevelSuggestionsContainer
    styles:
      - Background=$Surface
      - CornerRadius=0,0,14,14
      - Margin=22,0,22,0
      - Padding=0
  # The app keys are a little narrower than stock, so a row inside the card holds as many apps as before. The grid
  # keeps a strip on its right for the page dots; reaching past the card by that much centres the row.
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root > GridView#PinnedList
    styles:
      - Margin=0,0,-22,0
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root > GridView#PinnedList > * > ItemsWrapGrid
    styles:
      - ItemWidth=88
      - HorizontalAlignment=Center
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root > GridView#PinnedList > * > GridViewItem
    styles:
      - Width=88
      - MinWidth=0
  # Windows wraps each tile in a grid of its stock width, wider than the key, which left the icon and label 4 px right
  # of the key's centre; sized to the tile and centred, the wrapper puts them on the key.
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root > GridView#PinnedList > * > GridViewItem > Border#ContentBorder > Grid#DroppedFlickerWorkaroundWrapper > ContentPresenter > Grid
    styles:
      - Width=82
      - HorizontalAlignment=Center
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root > GridView#PinnedList > * > StartMenu.PinnedListTile, StartMenu.PinnedList#StartMenuPinnedList > Grid#Root > GridView#PinnedList > * > StartMenu.PinnedListCollapsedFolder
    styles:
      - Width=82
  # Pinned apps: raised B8 keys, each icon in a rounded well, label in Space Grotesk. A click pushes the key down 3 px
  # onto a 1 px lip, and its icon and label go down with it. Sizes are whole screen pixels at 125% (0.8 px each).
  - target: StartMenu.PinnedList > * > GridViewItem > Border#ContentBorder@CommonStates > Grid#DroppedFlickerWorkaroundWrapper > Border#BackgroundBorder
    styles:
      - Background:=$KeyBrush
      - BorderBrush=$KeyEdge
      - BorderThickness=0.8,0.8,0.8,3.2
      - CornerRadius=10
      # The pinned area has a fixed height, so the key stops short of the tile's bottom to leave the card's padding.
      - Margin=3,2.4,3,9
      - Background@Normal:=$KeyBrush
      - Background@PointerOver:=$KeyBrushHover
      - Background@Pressed:=$KeyBrush
      - Background@PressedSelected:=$KeyBrush
      - BorderThickness@Pressed=0.8
      - BorderThickness@PressedSelected=0.8
      - Margin@Pressed=3,4.8,3,9
      - Margin@PressedSelected=3,4.8,3,9
  - target: StartMenu.PinnedList > * > GridViewItem > Border#ContentBorder@CommonStates > Grid#DroppedFlickerWorkaroundWrapper > ContentPresenter
    styles:
      - HorizontalAlignment=Center
      - Margin@Pressed=0,2.4,0,0
      - Margin@PressedSelected=0,2.4,0,0
  # The key stops short of the tile's bottom, so the label's descenders sat on the lip; the icon and label rise 2 px to
  # sit evenly between the key's top and its lip.
  - target: StartMenu.PinnedListTile > Grid#Root
    styles:
      - RenderTransform:=<TranslateTransform Y="-1.6"/>
  - target: StartMenu.PinnedListTile > Grid#Root > Grid#LogoContainer
    styles:
      - Width=36
      - Height=36
      - CornerRadius=9
      - Background=$Well
      - BorderBrush=$WellRing
      - BorderThickness=1
  - target: StartMenu.PinnedListTile > Grid#Root > Grid#LogoContainer > Image#Logo
    styles:
      - Width=22
      - Height=22
  - target: StartMenu.PinnedListTile > Grid#Root > Grid#DisplayNameAndDownloadIconContainer > TextBlock#DisplayName
    styles:
      - FontSize=12.5
      - FontWeight=SemiBold
      - Foreground=$Text
  # Rows in All apps and Do first: flat, a soft highlight on hover, like the canvas's Do first rows.
  - target: GridView#AllAppsGrid > Border > ScrollViewer#ScrollViewer > Border#Root > Grid > ScrollContentPresenter#ScrollContentPresenter > ItemsPresenter > ItemsWrapGrid > GridViewItem > Border#ContentBorder@CommonStates > Grid#DroppedFlickerWorkaroundWrapper > Border#BackgroundBorder, GridView#RecommendedList > * > GridViewItem > Border#ContentBorder@CommonStates > Grid#DroppedFlickerWorkaroundWrapper > Border#BackgroundBorder
    styles:
      - Background=Transparent
      - BorderThickness=0
      - CornerRadius=9
      - Background@Normal=Transparent
      - Background@PointerOver=$Surface2
      - Background@Pressed=$Surface
  - target: ListViewItem > Grid@CommonStates > Border#BackgroundBorder, StartDocked.AppListViewItem > Grid@CommonStates > Border#BackgroundBorder
    styles:
      - CornerRadius=9
      - Background@PointerOver=$Surface2
      - Background@Pressed=$Surface
  # Footer: the work deck. The user is a ghost key on the left; folder shortcuts (Settings › Personalization ›
  # Start › Folders) are square keys; Power is the dark key with an orange icon and its label.
  - target: Grid#NavPanePlaceholder
    styles:
      - Background=$WellDeck
      - BorderBrush=$Line
      - BorderThickness=1
      - CornerRadius=14
      - Margin=14,0,14,14
  - target: StartDocked.NavigationPaneButton > Grid@CommonStates > Border#BackgroundBorder
    styles:
      - Background:=$KeyBrush
      - BorderBrush=$KeyEdge
      - BorderThickness=0.8,0.8,0.8,3.2
      - CornerRadius=10
      - Background@Normal:=$KeyBrush
      - Background@PointerOver:=$KeyBrushHover
      - Background@Pressed:=$KeyBrush
      - BorderThickness@Pressed=0.8
      - Margin@Pressed=0,2.4,0,0
  - target: StartDocked.NavigationPaneButton#UserTileButton > Grid@CommonStates > Border#BackgroundBorder
    styles:
      - Background=Transparent
      - BorderThickness=0
      - CornerRadius=10
      - Background@Normal=Transparent
      - Background@PointerOver=$Surface2
      - Background@Pressed=$Surface
  - target: StartDocked.NavigationPaneButton#PowerButton > Grid@CommonStates > Border#BackgroundBorder
    styles:
      - Background:=$ChromeBrush
      - BorderBrush=#000000
      - BorderThickness=0.8,0.8,0.8,3.2
      - CornerRadius=10
      - Background@Normal:=$ChromeBrush
      - Background@PointerOver:=$ChromeBrushHover
      - Background@Pressed:=$ChromeBrush
      - BorderThickness@Pressed=0.8
      - Margin@Pressed=0,2.4,0,0
  - target: StartDocked.NavigationPaneButton#PowerButton
    styles:
      - Width=Auto
      - MinWidth=104
      - Content:=<StackPanel Orientation="Horizontal" Spacing="9" HorizontalAlignment="Center" VerticalAlignment="Center" Margin="12,0,12,2"><Image Source="$Assets/icon-power.png" Width="14.4" Height="14.4"/><TextBlock Text="Power" FontFamily="Space Grotesk" FontWeight="SemiBold" FontSize="14" Foreground="$ChromeFg" VerticalAlignment="Center"/></StackPanel>
  # Footer keys' icons and labels go down with the key.
  - target: StartDocked.NavigationPaneButton > Grid@CommonStates > ContentPresenter
    styles:
      - Margin@Pressed=0,2.4,0,0
  - target: StartDocked.NavigationPaneButton > Grid > ContentPresenter > Grid > FontIcon, StartDocked.NavigationPaneButton > Grid > ContentPresenter#ContentPresenter > Grid > FontIcon
    styles:
      - Foreground=$Text2
  # Menus: graphite cards.
  - target: MenuFlyoutPresenter > Border
    styles:
      - Background=$Surface
      - BorderBrush=$Line
      - BorderThickness=1
      - CornerRadius=12
themeResourceVariables:
  - ContentControlThemeFontFamily=Space Grotesk
